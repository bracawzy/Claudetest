<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan calculator · Your Name</title>
  <meta name="description" content="Work out the monthly payment and total interest on a fixed-rate loan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <script type="module" src="../js/tools/loan-calculator.js"></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="site-title" href="../index.html">Your Name</a>
      <nav class="site-nav" aria-label="Main">
        <a href="../index.html">Home</a>
        <a href="../blog/index.html">Blog</a>
        <a href="../projects/index.html">Projects</a>
        <a href="../tools/index.html" aria-current="page">Tools</a>
        <a href="../about/index.html">About</a>
      </nav>
    </header>

    <main>
      <h1>Loan calculator</h1>
      <p>Monthly payment for a fixed-rate loan, like a mortgage or car loan.</p>

      <form id="loan-form" class="calc">
        <label for="loan-principal">Loan amount ($)
          <input id="loan-principal" name="principal" type="number" inputmode="decimal" min="0" step="any" value="300000">
        </label>
        <label for="loan-rate">Interest rate (% per year)
          <input id="loan-rate" name="rate" type="number" inputmode="decimal" min="0" step="any" value="6.5">
        </label>
        <label for="loan-years">Term (years)
          <input id="loan-years" name="years" type="number" inputmode="decimal" min="0" step="any" value="30">
        </label>
      </form>

      <div aria-live="polite">
        <dl id="loan-results" class="calc-results" hidden>
          <dt>Monthly payment</dt><dd id="loan-monthly"></dd>
          <dt>Total paid</dt><dd id="loan-total"></dd>
          <dt>Total interest</dt><dd id="loan-interest"></dd>
        </dl>
        <p id="loan-error" class="calc-error" hidden></p>
      </div>

      <p><a href="../tools/index.html">&larr; All tools</a></p>
    </main>

    <footer class="site-footer">&copy; 2026 Your Name</footer>
  </div>
</body>
</html>
